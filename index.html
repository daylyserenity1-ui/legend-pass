<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legend Pass - Thailand Legends Never Die</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; border-radius: 16px; padding: 32px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h1 { color: #f59e0b; text-align: center; margin-bottom: 8px; font-size: 24px; }
        p.subtitle { color: #94a3b8; text-align: center; margin-bottom: 24px; font-size: 14px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; color: #cbd5e1; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #f59e0b; }
        button { width: 100%; padding: 14px; background: #f59e0b; color: #0f172a; font-weight: bold; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button:hover { background: #d97706; }
        #statusMessage { margin-top: 16px; text-align: center; font-size: 14px; display: none; padding: 10px; border-radius: 6px; }
        .success { background: #065f46; color: #34d399; }
        .error { background: #991b1b; color: #fca5a5; }
    </style>
</head>
<body>

<div class="card">
    <h1>LEGEND PASS</h1>
    <p class="subtitle">ลงทะเบียนรับสิทธิ์เข้าร่วมแคมเปญ</p>
    
    <form id="passForm">
        <div class="form-group">
            <label for="fullname">ชื่อ-นามสกุล</label>
            <input type="text" id="fullname" placeholder="กรอกชื่อ-นามสกุล" required>
        </div>
        <div class="form-group">
            <label for="email">อีเมล</label>
            <input type="email" id="email" placeholder="example@email.com" required>
        </div>
        <div class="form-group">
            <label for="tier">สิทธิ์ Legend Pass</label>
            <select id="tier">
                <option value="Standard Pass">Standard Pass</option>
                <option value="VIP Pass">VIP Pass</option>
                <option value="Ultimate Pass">Ultimate Pass</option>
            </select>
        </div>
        <button type="submit" id="submitBtn">ยืนยันการรับ Pass</button>
    </form>

    <div id="statusMessage"></div>
</div>

<!-- Firebase SDK (v10 Modular) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyD-EXAMPLE_KEY_HERE", 
        authDomain: "thailand-legends-never-d-f4131.firebaseapp.com",
        projectId: "thailand-legends-never-d-f4131",
        storageBucket: "thailand-legends-never-d-f4131.appspot.com",
        messagingSenderId: "100000000000",
        appId: "1:100000000000:web:abcdef123456"
    };

    // Initialize Firebase & Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Form Handlers
    const form = document.getElementById('passForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMessage');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        submitBtn.disabled = true;
        submitBtn.innerText = "กำลังบันทึกข้อมูล...";
        statusMsg.style.display = 'none';

        const fullname = document.getElementById('fullname').value;
        const email = document.getElementById('email').value;
        const tier = document.getElementById('tier').value;

        try {
            // บันทึกลง Collection ชื่อ "participants"
            await addDoc(collection(db, "participants"), {
                fullname: fullname,
                email: email,
                passTier: tier,
                createdAt: serverTimestamp()
            });

            showStatus("ลงทะเบียนรับ Legend Pass เรียบร้อยแล้ว!", "success");
            form.reset();
        } catch (error) {
            console.error("Error adding document: ", error);
            showStatus("เกิดข้อผิดพลาด: " + error.message, "error");
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "ยืนยันการรับ Pass";
        }
    });

    function showStatus(text, type) {
        statusMsg.innerText = text;
        statusMsg.className = type;
        statusMsg.style.display = 'block';
    }
</script>

</body>
</html>
