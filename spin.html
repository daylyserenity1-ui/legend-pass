<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUCKY DRAW - Thailand Legends Never Die</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; }
        body { background: #050505; color: #fff; text-align: center; min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        h1 { font-family: 'Montserrat', sans-serif; font-size: 32px; color: #f59e0b; margin-bottom: 5px; text-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
        p.sub { color: #ec4899; font-size: 15px; margin-bottom: 20px; font-weight: 600; }
        .wheel-container { position: relative; width: 360px; height: 360px; margin: 0 auto; }
        canvas { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 0 35px rgba(245, 158, 11, 0.5); }
        .pointer { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-top: 30px solid #ec4899; z-index: 10; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.8)); }
        
        .action-btns { display: flex; gap: 12px; margin-top: 25px; flex-wrap: wrap; justify-content: center; }
        button { padding: 14px 32px; font-size: 18px; font-weight: 700; background: linear-gradient(135deg, #f59e0b, #ec4899); color: #000; border: none; border-radius: 30px; cursor: pointer; box-shadow: 0 5px 20px rgba(236, 72, 153, 0.4); transition: all 0.3s ease; }
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(245, 158, 11, 0.6); }
        button:disabled { background: #475569; color: #888; cursor: not-allowed; box-shadow: none; transform: none; }
        .btn-export { background: #10b981; color: #fff; box-shadow: 0 5px 20px rgba(16, 185, 129, 0.3); font-size: 14px; padding: 14px 20px; }

        #winnerModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88); backdrop-filter: blur(10px); flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .winner-card { background: #18181b; border: 2px solid #f59e0b; padding: 36px; border-radius: 24px; max-width: 90%; width: 400px; box-shadow: 0 0 50px rgba(245, 158, 11, 0.6); }
        .winner-title { color: #ec4899; font-size: 18px; font-weight: 700; letter-spacing: 1px; }
        .winner-name { font-size: 28px; font-weight: 800; color: #fef08a; margin: 18px 0; text-shadow: 0 0 10px rgba(254, 240, 138, 0.5); }
        .close-btn { background: #22c55e; color: #000; padding: 12px 24px; font-size: 15px; margin-top: 10px; width: 100%; border-radius: 12px; }
    </style>
</head>
<body>

    <h1>🎉 MAIN STAGE LUCKY DRAW 🎉</h1>
    <p class="sub">THAILAND LEGENDS NEVER DIE</p>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="400" height="400"></canvas>
    </div>

    <div class="action-btns">
        <button id="spinBtn">🎰 หมุนวงล้อสุ่มรางวัล</button>
        <button id="exportBtn" class="btn-export">📥 โหลดรายชื่อ (CSV)</button>
    </div>

    <p id="participantCount" style="margin-top: 14px; font-size: 14px; color: #a1a1aa;">กำลังดึงรายชื่อผู้ลงทะเบียน...</p>

    <div id="winnerModal">
        <div class="winner-card">
            <div class="winner-title">🎊 ยินดีด้วยกับผู้โชคดี! 🎊</div>
            <div class="winner-name" id="winnerName">-</div>
            <button class="close-btn" onclick="closeModal()">ตกลง (นำรายชื่อนี้ออกจากการสุ่มถัดไป)</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        authDomain: "thailand-legends-never-d-f4131.firebaseapp.com",
        projectId: "thailand-legends-never-d-f4131",
        storageBucket: "thailand-legends-never-d-f4131.appspot.com",
        messagingSenderId: "100000000000",
        appId: "1:100000000000:web:abcdef123456"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let rawParticipants = [];
    let names = [];
    const colors = ['#f59e0b', '#ec4899', '#8b5cf6', '#3b82f6', '#10b981', '#ef4444'];
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const exportBtn = document.getElementById('exportBtn');
    
    let currentAngle = 0;
    let isSpinning = false;
    let currentWinnerIndex = -1;

    async function loadUsers() {
        try {
            const snapshot = await getDocs(collection(db, "participants"));
            rawParticipants = snapshot.docs.map(doc => doc.data());
            names = rawParticipants.map(p => p.fullname);

            document.getElementById('participantCount').innerText = `ผู้มีสิทธิ์สุ่มรางวัลขณะนี้: ${names.length} คน`;
            
            if (names.length === 0) {
                alert("ยังไม่มีผู้ลงทะเบียนในระบบครับ!");
                spinBtn.disabled = true;
                return;
            }
            drawWheel();
        } catch (err) {
            console.error(err);
            alert("เกิดข้อผิดพลาดในการดึงข้อมูล");
        }
    }

    function drawWheel() {
        const numSegments = names.length;
        if (numSegments === 0) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            return;
        }

        const sliceAngle = (2 * Math.PI) / numSegments;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < numSegments; i++) {
            const angle = currentAngle + i * sliceAngle;
            ctx.beginPath();
            ctx.fillStyle = colors[i % colors.length];
            ctx.moveTo(200, 200);
            ctx.arc(200, 200, 190, angle, angle + sliceAngle);
            ctx.lineTo(200, 200);
            ctx.fill();

            ctx.save();
            ctx.translate(200, 200);
            ctx.rotate(angle + sliceAngle / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#fff";
            ctx.font = "bold 13px Kanit";
            ctx.fillText(names[i].substring(0, 16), 175, 5);
            ctx.restore();
        }
    }

    spinBtn.addEventListener('click', () => {
        if (isSpinning || names.length === 0) return;
        isSpinning = true;
        spinBtn.disabled = true;

        const spinRounds = 5 + Math.random() * 5; 
        const randomDegree = Math.random() * 360;
        const totalRotation = (spinRounds * 360 + randomDegree) * (Math.PI / 180);
        
        let start = null;
        const duration = 4500;

        function animateWheel(timestamp) {
            if (!start) start = timestamp;
            const progress = (timestamp - start) / duration;

            if (progress < 1) {
                const easeOut = 1 - Math.pow(1 - progress, 3);
                currentAngle = easeOut * totalRotation;
                drawWheel();
                requestAnimationFrame(animateWheel);
            } else {
                currentAngle = totalRotation % (2 * Math.PI);
                drawWheel();
                
                const sliceAngle = (2 * Math.PI) / names.length;
                let normalizedAngle = (3.5 * Math.PI - currentAngle) % (2 * Math.PI);
                if (normalizedAngle < 0) normalizedAngle += 2 * Math.PI;
                
                currentWinnerIndex = Math.floor(normalizedAngle / sliceAngle) % names.length;
                showWinner(names[currentWinnerIndex]);
            }
        }
        requestAnimationFrame(animateWheel);
    });

    function showWinner(name) {
        document.getElementById('winnerName').innerText = name;
        document.getElementById('winnerModal').style.display = 'flex';
        confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
    }

    window.closeModal = function() {
        document.getElementById('winnerModal').style.display = 'none';
        if (currentWinnerIndex !== -1) {
            names.splice(currentWinnerIndex, 1);
            document.getElementById('participantCount').innerText = `ผู้มีสิทธิ์สุ่มรางวัลขณะนี้: ${names.length} คน`;
        }
        isSpinning = false;
        spinBtn.disabled = names.length === 0;
        drawWheel();
    };

    exportBtn.addEventListener('click', () => {
        if (rawParticipants.length === 0) {
            alert("ไม่มีข้อมูลสำหรับดาวน์โหลด");
            return;
        }

        let csvContent = "\uFEFFPass ID,ชื่อ-นามสกุล,อีเมล\n";
        rawParticipants.forEach(p => {
            csvContent += `"${p.passId}","${p.fullname}","${p.email}"\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `Registered_Participants_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });

    loadUsers();
</script>
</body>
</html>
